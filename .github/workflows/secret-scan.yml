# DETECTIVE control only (v2.4 D6/A3): a red X + GitHub notification on a pushed
# secret. It CANNOT block a direct push — the authoritative fail-closed gate is the
# in-script staged+range scan on each machine (out-of-tree scanner copies).
# No privileged secrets in this workflow; repo default workflow permissions = read.
name: secret-scan
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Range scan (new commits only on push; full PR range on PR)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # first push / new branch: scan against empty tree via merge-base guard
            if ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE="$(git hash-object -t tree /dev/null)"
              python3 scripts/sync-lane/secretscan.py $(git ls-files) && exit 0 || exit 2
            fi
          fi
          python3 scripts/sync-lane/secretscan.py --range "$BASE..HEAD"
